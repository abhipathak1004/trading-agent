[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "bharatquant"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "argon2-cffi>=25.1,<26",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "jsonschema>=4.26,<5",
    # Deterministic technical indicators (ADR-014). Pandas produces float64
    # prices; the single conversion point back to CurrencyPaise is explicit.
    "numpy>=2.5,<3",
    "pandas>=3.1,<4",
    # Official Zerodha Kite Connect client, used read-only for quotes and
    # candles (ADR-013). It also pulls in the WebSocket ticker stack we do not
    # use; that cost is accepted so the vendor matches the vendor's own client.
    "kiteconnect>=5.2,<6",
    # Imported directly, so declared directly rather than relied on as
    # transitive dependencies of fastapi.
    "pydantic>=2.14,<3",
    "referencing>=0.37,<1",
    "starlette>=1.10,<2",
    "tzdata",
    "uvicorn>=0.34,<1",
]

[project.scripts]
bq = "bq.cli:main"

[dependency-groups]
dev = [
    "hatchling==1.33.0",
    "httpx",
    "mypy",
    # pandas ships no type information; strict mypy needs stubs. Development
    # only — it is never imported at runtime.
    "pandas-stubs",
    "pytest",
    "ruff",
    "types-jsonschema>=4.26,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/bq"]
artifacts = ["backend/src/bq/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the source tree importable regardless of how the editable install was
# recorded. On macOS a `.pth` carrying the hidden file flag is skipped by
# `site.py`, which otherwise breaks `import bq` intermittently.
pythonpath = ["backend/src"]

[tool.ruff]
target-version = "py313"

# Vendored verbatim from Agent Zero (MIT); keep it a faithful copy, so do not
# reformat or lint it as our own source.
extend-exclude = ["backend/src/bq/dirty_json.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["bq"]

[tool.mypy]
strict = true
files = ["backend/src", "tests"]

# Vendored verbatim from Agent Zero (MIT) to keep a faithful copy of a mature
# dirty-JSON parser; it is untyped upstream, so strict mode is relaxed for it.
[[tool.mypy.overrides]]
module = ["bq.dirty_json"]
ignore_errors = true

# kiteconnect ships no type information (no py.typed marker). It is a vendored
# third-party client we call through a narrow protocol in the vendor module; the
# one direct import in wiring.py is the only untyped surface we touch.
[[tool.mypy.overrides]]
module = ["kiteconnect", "kiteconnect.*"]
ignore_missing_imports = true
