[project]
name = "pinak"
version = "0.1.0"
description = "Intraday signal desk for Indian cash equities"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "polars>=1.10",
    "pyarrow>=17",
    "httpx>=0.27",
    "structlog>=24.4",
    "typer>=0.12",
]

[project.scripts]
pinak = "pinak.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pinak"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
